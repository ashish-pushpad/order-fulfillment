syntax = "proto3";

package proto;

option go_package = "/proto/userpb";


service UserService{
    rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse);
}


message GetUserByIdRequest {
    int64 id=1;
}

message GetUserByIdResponse{
    int64 id=1;
    string name=2;
    string email = 3;
    string role = 4;
}