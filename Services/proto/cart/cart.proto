syntax = "proto3";
package proto ;

import "google/protobuf/empty.proto";

option go_package = "proto/cartpb";

service CartService {
    rpc GetUserCart(GetUserCartRequest) returns (GetUserCartResponse);
    rpc EmptyCart(EmptyCartRequest) returns (google.protobuf.Empty) ;
}


message GetUserCartRequest{
    int64 user_id=1;
}

message CartItemResponse {
  int64 id = 1;
  int64 product_id = 2;
  int64 quantity = 3;
  float unit_price = 4;
  float total_price = 5;
  string product_name = 6;
  string product_description =7;
  string product_img_url=8; 

}

message GetUserCartResponse {
  int64 id = 1;
  int64 user_id = 2;
  repeated CartItemResponse items = 3;
  float sub_total = 4;
  int64 total_items = 5;
}


message EmptyCartRequest{
   int64 user_id=1;
}