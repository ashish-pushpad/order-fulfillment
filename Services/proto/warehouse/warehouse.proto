syntax = "proto3";

package proto;

option go_package="proto/warehousepb";

import "google/protobuf/empty.proto";



service WarehouseProto {
   rpc  GetWarehouse( GetWarehouseRequest) returns (GetWarehouseResponse);
    rpc CreateWarehouse(CreateWarehouseRequest) returns (google.protobuf.Empty);
   rpc GetWarehouses(GetWarehousesRequest) returns ( GetWarehousesResponse);
   rpc DeleteWarehouse(DeleteWarehouseRequest) returns (DeleteWarehouseResponse);
}


message GetWarehouseRequest {
    int64  id=1;
}


message GetWarehouseResponse{
    int64 	id=1;
	string name=2;
	string city=3;
	string addressd=4;
}

message GetWarehousesRequest{
    int64 page =1;
    int64 limit = 2;
}

message GetWarehousesResponse{
    repeated GetWarehouseResponse warehouses = 1;
}

message CreateWarehouseRequest{
    string name = 1;
    string city =2;
    string address =3;
}

message DeleteWarehouseRequest{
    int64 id =1;
}

message DeleteWarehouseResponse{
    int64 id =1;
}
