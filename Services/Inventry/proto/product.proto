syntax = "proto3";

package proto;

option go_package = "./proto/productpb";

service ProductService {
    rpc IsExistProduct (IsExistProductRequest) returns (IsExistProductResponse);
    rpc GetProductsByIds (GetProductsByIdsRequest) returns (GetProductsByIdsResponse);
    rpc GetProductPriceById (GetProductPriceByIdRequest) returns (GetProductPriceByIdResponse);
}

message IsExistProductRequest {
    int64 id = 1;
}

message IsExistProductResponse {
    int64 id = 1;
}



message GetProductsByIdsRequest {
     repeated int64 ids = 1;
}

message Product {
    int64 id=1;
    string name=2;
    string description=3;
    string img_url =4;

}

message GetProductsByIdsResponse {
   repeated Product  products = 1;
}

message GetProductPriceByIdRequest{
    int64 id=1;
}

message GetProductPriceByIdResponse{
    int64 id=1;
    float price=2;
}